<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Flash Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }
        #player-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Load the official Ruffle library from the unpkg CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- This div acts as the container where the Ruffle player will be inserted -->
    <div id="player-container"></div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Check if Ruffle loaded successfully
            const ruffle = window.RufflePlayer?.newest();
            const container = document.getElementById("player-container");
            
            if (ruffle && container) {
                // Create an instance of the player
                const player = ruffle.createPlayer();
                
                // Style the player to fill up its parent container
                player.style.width = "100%";
                player.style.height = "100%";
                container.appendChild(player);
                
                // Load your SWF file here
                // Replace 'your-game.swf' with the actual path or URL to your Flash file
                player.load({
                    url: "your-game.swf",
                    allowScriptAccess: true
                });
            } else {
                container.textContent = "Ruffle failed to load from the CDN.";
            }
        });
    </script>

</body>
</html>
